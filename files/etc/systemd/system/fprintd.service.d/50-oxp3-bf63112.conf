# Written by CachyOS-OneXPlayer3 modules/85-fingerprint.sh.
# fprintd loads libfprint with the BF63112 driver (package
# libfprint-bf63112-oxp3) instead of the distro libfprint, which stays
# installed and is what everything else uses.
[Service]
Environment=LD_LIBRARY_PATH=/usr/lib/libfprint-bf63112
# The sensor's reset line is on this one GPIO controller (symlink from
# /etc/udev/rules.d/69-oxp3-fingerprint.rules); the stock unit allows none.
DeviceAllow=/dev/oxp3-fingerprint-gpiochip rw
# Matcher thresholds measured on this device (tools/fingerprint-test.sh).
# A touch matches when the SIGFM score OR the RANSAC inlier count reaches
# its threshold. At the defaults (score 100, inliers 8) another finger of
# the same hand matched 4 of 23 times, always through the score (112-338).
# Inliers alone separate cleanly: other finger below 8, own finger mostly
# 20+. So the score path is switched off and inliers must reach twice the
# default; own finger still matched 22 of 23 touches.
Environment=LIBFPRINT_BF63112_SIGFM_THRESHOLD=1000000000
Environment=LIBFPRINT_BF63112_RANSAC_THRESHOLD=16
